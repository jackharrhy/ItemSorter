plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'com.gradleup.shadow' version '9.4.0'
}
version = '26.3'
group = 'tollenaar.stephen'
base { archivesName = 'ItemSorter-Fabric' }
repositories { mavenCentral() }
loom { serverOnlyMinecraftJar() }
configurations { webLibraries }
configurations.implementation.extendsFrom(configurations.webLibraries)
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.20.1'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.165.0+26.3'
    webLibraries 'io.javalin:javalin:4.5.0'
    webLibraries 'org.thymeleaf:thymeleaf:3.0.9.RELEASE'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
sourceSets {
    main {
        java { srcDir '../src/main/java'; include '**/Shared/**', '**/Util/Web/HopperItems.java', '**/Util/Web/Ratio.java', '**/Util/Web/Item.java', '**/fabric/**' }
        resources { srcDir '../src/main/resources'; exclude 'plugin.yml', 'config.yml', 'META-INF/MANIFEST.MF' }
    }
    test { java { srcDir '../src/test/java'; include '**/Shared/**', '**/fabric/**', '**/Util/Web/RatioTest.java' } }
}
processResources { filesMatching('itemsorter-web/index.html') { filter { it.replace('${maxInputItems}', '100') } } }
shadowJar {
    configurations = [project.configurations.webLibraries]
    archiveClassifier = ''
    dependencies { exclude(dependency('org.slf4j:.*:.*')); exclude(dependency('com.google.code.gson:.*:.*')) }
    filesMatching('META-INF/services/**') { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
    mergeServiceFiles()
    relocate 'io.javalin', 'tollenaar.stephen.ItemSorter.internal.javalin'
    relocate 'kotlin', 'tollenaar.stephen.ItemSorter.internal.kotlin'
    relocate 'org.eclipse.jetty', 'tollenaar.stephen.ItemSorter.internal.jetty'
    relocate 'javax.servlet', 'tollenaar.stephen.ItemSorter.internal.servlet'
    relocate 'org.thymeleaf', 'tollenaar.stephen.ItemSorter.internal.thymeleaf'
    relocate 'org.attoparser', 'tollenaar.stephen.ItemSorter.internal.attoparser'
    relocate 'org.unbescape', 'tollenaar.stephen.ItemSorter.internal.unbescape'
    relocate 'ognl', 'tollenaar.stephen.ItemSorter.internal.ognl'
    relocate 'javassist', 'tollenaar.stephen.ItemSorter.internal.javassist'
    relocate 'org.objectweb.asm', 'tollenaar.stephen.ItemSorter.internal.asm'
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class', 'META-INF/versions/*/module-info.class'
}
jar { archiveClassifier = 'thin' }
test { useJUnitPlatform() }
build.dependsOn shadowJar
sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}
tasks.register('smokeJar', Jar) {
    dependsOn smokeClasses
    from sourceSets.smoke.output
    archiveBaseName = 'itemsorter-smoke'
}
